[package]
name = "astro-clock"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "astro-clock"
path = "src/main.rs"

[lib]
name = "astro_clock"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
tiny-skia = "0.8"
fontdue = "0.8"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive"] }
ron = "0.8"
thiserror = "1.0"
rust_decimal = { version = "1.30" }
bigdecimal = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
swiss-eph = "0.2.1"
sysinfo = "0.30"
image-webp = "0.2.4"
png = "0.17"
lru = "0.12"
strum = "0.28"
strum_macros = "0.28"
svg = "0.18"
async-trait = "0.1"
ttf-parser = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = []
db = ["sqlx", "chrono/serde"]

[dependencies.sqlx]
version = "0.8"
optional = true
features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid"]
default-features = false

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1.0"
assert_cmd = "2.0"
predicates = "3.0"
