[package]
name = "astro-clock"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
tiny-skia = "0.8"
fontdue = "0.8"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive"] }
ron = "0.8"
thiserror = "1.0"
rust_decimal = "1.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
swiss-eph = "0.2.1"
image-webp = "0.2.4"
png = "0.17"

[features]
default = []
db = ["sqlx", "chrono/serde"]

[dependencies.sqlx]
version = "0.8"
optional = true
features = ["runtime-tokio", "postgres", "macros"]
default-features = false

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1.0"
