[package]
name = "astro-clock"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
tiny-skia = "0.8"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
ron = "0.8"
thiserror = "1.0"
rust_decimal = "1.30"
serde = { version = "1.0", features = ["derive"] }
swiss-eph = "0.2.1"

[dev-dependencies]
tempfile = "3"
